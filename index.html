<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>מערכת פרנס השבוע</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ייבוא גופנים מסורתיים בסגנון סת"ם / ספרי קודש לטלוויזיה בלבד -->
    <link href="https://fonts.googleapis.com/css2?family=Bellefair&family=David+Libre:wght@500;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/stam-ashkenaz-clm" rel="stylesheet">
    <style>
        :root { --ios-bg: #F2F2F7; --ios-blue: #007AFF; }
        body { background-color: var(--ios-bg); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        
        /* גופן סת"ם / כתב תורה מיוחד שמוחל רק על מסך הטלוויזיה */
        .torah-font { 
            font-family: 'Stam Ashkenaz CLM', 'David Libre', 'Frank Ruhl Libre', serif; 
            letter-spacing: 0.03em;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        }

        header {
            padding-top: env(safe-area-inset-top); 
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .safe-top { padding-top: 15px; padding-bottom: 12px; }

        .tab-content { display: none; padding-bottom: 140px; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* עיצוב מקורי חלק ולבן ללשוניות ברכות השבוע והארכיון */
        .ios-card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; backdrop-filter: blur(10px); }
        .modal-content { position: absolute; bottom: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom) + 50px); }
        
        input, select, textarea { width: 100%; border: 1px solid #ddd; padding: 14px; border-radius: 12px; background: #f9f9f9; margin-bottom: 12px; font-size: 16px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--ios-blue); background: white; }
        .btn-primary { background: var(--ios-blue); color: white; padding: 16px; border-radius: 14px; font-weight: bold; width: 100%; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.7; }
        
        /* מסך נעילה / התחברות */
        #authScreen { display: flex; position: fixed; inset: 0; background: var(--ios-bg); z-index: 300; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
        
        /* עיצוב מסך טלוויזיה מקורי */
        #tvScreen { display: none; position: fixed; inset: 0; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); z-index: 200; color: white; overflow: hidden; }
        .tv-scroll-container { height: calc(100vh - 130px); overflow: hidden; position: relative; }
        .tv-scroll-track { display: flex; flex-direction: column; gap: 40px; padding: 40px 100px; animation: scrollUp 28s linear infinite; max-width: 1400px; margin: 0 auto; }
        .tv-scroll-track:hover { animation-play-state: paused; }
        @keyframes scrollUp {
            0% { transform: translateY(90vh); }
            100% { transform: translateY(-100%); }
        }

        /* עיצוב הקוביות בטלוויזיה בלבד - סגנון שער היכל בית כנסת עם עמודים */
        .tv-card {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #d4af37;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 0 25px rgba(212, 175, 55, 0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* גוף הקובייה עם 2 עמודי זהב בצדדים וקשת במרכז */
        .tv-card-body {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            position: relative;
        }

        /* עמודי זהב בתוך הקובייה */
        .tv-card-pillar {
            width: 52px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background-color: #c59b27;
            background-image: 
                linear-gradient(90deg, rgba(80,55,0,0.65) 0%, rgba(255,255,255,0.4) 35%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0.4) 65%, rgba(80,55,0,0.65) 100%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(90, 62, 0, 0.35) 10px, rgba(90, 62, 0, 0.35) 13px),
                repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(90, 62, 0, 0.35) 10px, rgba(90, 62, 0, 0.35) 13px);
            border-left: 2px solid #8b6508;
            border-right: 2px solid #8b6508;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.4);
        }

        .tv-card-pillar::before, .tv-card-pillar::after {
            content: "❖";
            height: 24px;
            background: linear-gradient(90deg, #7a5805 0%, #d4af37 50%, #7a5805 100%);
            color: #4a3500;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #fff3b0;
            border-bottom: 1px solid #5a4000;
        }
        .tv-card-pillar::after {
            margin-top: auto;
        }

        /* התוכן הפנימי הקשתי של הקובייה */
        .tv-card-content {
            flex: 1;
            margin: 14px 18px;
            padding: 28px 36px;
            background: radial-gradient(circle at top, rgba(255, 255, 255, 0.08) 0%, rgba(15, 23, 42, 0.85) 100%);
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 90px 90px 16px 16px;
            text-align: center;
            box-shadow: inset 0 6px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- מסך התחברות (PIN Code) -->
    <div id="authScreen">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="lock" class="w-8 h-8"></i>
            </div>
            <h2 class="text-xl font-bold mb-1">כניסה למערכת</h2>
            <p class="text-xs text-gray-400 mb-6">הזן את קוד ה-PIN לצפייה וניהול הברכות</p>
            <form onsubmit="handleLogin(event)">
                <input type="password" id="pinInput" placeholder="קוד PIN (מספרים או אותיות)" class="text-center tracking-widest text-lg font-bold" required>
                <button type="submit" class="btn-primary mt-2">כניסה למערכת</button>
            </form>
        </div>
    </div>

    <!-- כותרת עליונה -->
    <header class="bg-white/80 sticky top-0 z-50 border-b px-5">
        <div class="safe-top flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 id="page-title" class="text-2xl font-bold tracking-tight text-gray-900">ברכות השבוע</h1>
                <span id="syncLoader" class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-full font-bold hidden">מסנכרן...</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="logout()" class="text-gray-400 p-2 rounded-full active:scale-90 transition" title="התנתק ממכשיר זה">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
                <button onclick="fetchFromSheet()" class="text-gray-500 p-2 rounded-full active:scale-90 transition" title="רענן נתונים">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
                <button onclick="openNewBlessingModal()" class="bg-blue-600 text-white p-2 rounded-full shadow-lg active:scale-90 transition mr-1">
                    <i data-lucide="plus" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- תוכן ראשי -->
    <main class="p-4">
        <section id="activeTab" class="tab-content active">
            <div class="flex flex-col gap-2 mb-4">
                <input type="date" id="dateFilter" onchange="renderActive()" class="shadow-sm text-sm !mb-0">
                <input type="text" id="activeSearch" oninput="renderActive()" placeholder="חיפוש חופשי (שם משפחה / תוכן הברכה...)" class="shadow-sm !mb-0">
            </div>
            <div id="activeList"></div>
        </section>

        <section id="archiveTab" class="tab-content">
            <div class="bg-blue-50 border border-blue-100 text-blue-800 text-xs p-3 rounded-xl mb-3 leading-relaxed">
                כל ברכה חדשה נשמרת אוטומטית בארכיון. לחץ על <strong>"שכפל"</strong> כדי להציג שוב ברכה מהעבר עם תאריך מעודכן.
            </div>
            <input type="text" id="archiveSearch" oninput="renderArchive()" placeholder="חפש בארכיון לפי משפחה או שם..." class="shadow-sm">
            <div id="archiveList"></div>
        </section>
    </main>

    <!-- תפריט תחתון -->
    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t flex justify-around py-4 pb-8 z-50 text-gray-400">
        <button onclick="switchTab('activeTab')" id="btn-activeTab" class="text-blue-600 flex flex-col items-center">
            <i data-lucide="calendar-check"></i>
            <span class="text-[10px] mt-1 font-bold">ברכות השבוע</span>
        </button>
        <button onclick="switchTab('archiveTab')" id="btn-archiveTab" class="flex flex-col items-center">
            <i data-lucide="archive"></i>
            <span class="text-[10px] mt-1 font-bold">ארכיון</span>
        </button>
        <button onclick="openTvMode()" class="flex flex-col items-center">
            <i data-lucide="tv"></i>
            <span class="text-[10px] mt-1 font-bold">מסך טלוויזיה</span>
        </button>
    </nav>

    <!-- מודאל הוספה / עריכה -->
    <div id="blessingModal" class="modal" onclick="closeModalOnBackdrop(event)">
        <div class="modal-content">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 border-b pb-2 text-center">הוספת ברכה חדשה</h2>
            <form id="blessingForm">
                <input type="hidden" id="editId" value="">
                <input type="hidden" id="fromArchiveFlag" value="">

                <label class="text-xs text-gray-500 px-1 font-bold">שם התורם / המשפחה</label>
                <input type="text" id="donorName" placeholder="לדוגמה: משפחת כהן" required>

                <label class="text-xs text-gray-500 px-1 font-bold">שמות המתברכים / נוסח הברכה</label>
                <textarea id="blessingText" rows="3" placeholder="הזן את השמות או את נוסח הברכה..." required></textarea>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-500 px-1 font-bold">מתאריך</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 px-1 font-bold">עד תאריך</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="btn-primary mt-2">שמור בלוח</button>
                <button type="button" onclick="closeAllModals()" class="w-full py-3 text-gray-400 font-bold">ביטול</button>
            </form>
        </div>
    </div>

    <!-- מסך טלוויזיה עם גופן סת"ם תורני וכפתור מסך מלא -->
    <div id="tvScreen" class="torah-font">
        <div class="px-10 py-6 border-b border-amber-500/30 flex justify-between items-center bg-slate-900/90">
            <div>
                <h1 class="text-6xl font-black text-amber-400 tracking-wide">פרנס השבוע</h1>
                <p class="text-slate-300 text-2xl mt-1">כולל "מדרש ראובן"</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="tvDateDisplay" class="text-amber-300 text-3xl font-bold bg-amber-500/10 border border-amber-500/30 px-5 py-2.5 rounded-2xl">טוען תאריך עברי ופרשה...</span>
                
                <!-- כפתור מסך מלא -->
                <button onclick="toggleFullScreen()" id="fullscreenBtn" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-4 py-2.5 rounded-xl text-base font-sans font-bold flex items-center gap-2 transition">
                    <i data-lucide="maximize" id="fullscreenIcon" class="w-5 h-5"></i>
                    <span id="fullscreenText">מסך מלא</span>
                </button>

                <!-- כפתור יציאה -->
                <button onclick="closeTvMode()" class="bg-white/10 hover:bg-white/20 text-white px-4 py-2.5 rounded-xl text-base font-sans font-bold transition">
                    יציאה ✕
                </button>
            </div>
        </div>
        <div class="tv-scroll-container">
            <div id="tvTrack" class="tv-scroll-track"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5ovUkLZAK9NkuXIDz6Jt6mprcAJ4FrZIEaChK4B__HmK_untmfTuAyqK8aX_Z9fTX/exec";
        let dbData = { active: [], archive: [] };
        let tvInterval = null;

        function init() {
            lucide.createIcons();
            updateHebrewDateAndParasha();
            
            const savedPin = localStorage.getItem('parnas_user_pin');
            if (savedPin) {
                document.getElementById('authScreen').style.display = 'none';
                fetchFromSheet();
            }

            if (window.location.search.includes('mode=tv')) {
                if (savedPin) {
                    document.getElementById('authScreen').style.display = 'none';
                    openTvMode();
                } else {
                    document.getElementById('authScreen').style.display = 'flex';
                }
            }
        }

        // הפעלה וכיבוי של מצב מסך מלא בטלוויזיה
        function toggleFullScreen() {
            const tvElem = document.getElementById('tvScreen');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (tvElem.requestFullscreen) {
                    tvElem.requestFullscreen();
                } else if (tvElem.webkitRequestFullscreen) {
                    tvElem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // עדכון כפתור מסך מלא כאשר המצב משתנה
        function updateFullscreenButton() {
            const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
            const textEl = document.getElementById('fullscreenText');
            const iconEl = document.getElementById('fullscreenIcon');
            if (textEl && iconEl) {
                textEl.innerText = isFull ? 'צא ממסך מלא' : 'מסך מלא';
                iconEl.setAttribute('data-lucide', isFull ? 'minimize' : 'maximize');
                lucide.createIcons();
            }
        }
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        // פונקציית עזר לנירמול תאריך לפורמט YYYY-MM-DD
        function formatDateOnly(val) {
            if (!val) return "";
            const str = String(val).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            if (str.includes('T')) return str.slice(0, 10);
            const d = new Date(str);
            if (!isNaN(d.getTime())) {
                return d.toISOString().slice(0, 10);
            }
            return str;
        }

        // פונקציה שמסדרת כל שורה לפי מבנה העמודות החדש:
        // A: id | B: donorName | C: blessingText | D: startDate | E: endDate
        function normalizeRow(item) {
            if (Array.isArray(item)) {
                return {
                    id: item[0] ?? "",
                    donorName: item[1] ?? "",
                    blessingText: item[2] ?? "",
                    startDate: formatDateOnly(item[3]),
                    endDate: formatDateOnly(item[4])
                };
            }

            const isShifted = ('blessingType' in item) && (item.endDate === "" || item.endDate === undefined || item.endDate === null);

            if (isShifted) {
                return {
                    id: item.id ?? "",
                    donorName: item.donorName ?? "",
                    blessingText: item.blessingType ?? "",
                    startDate: formatDateOnly(item.blessingText),
                    endDate: formatDateOnly(item.startDate)
                };
            }

            return {
                id: item.id ?? "",
                donorName: item.donorName ?? "",
                blessingText: item.blessingText ?? "",
                startDate: formatDateOnly(item.startDate),
                endDate: formatDateOnly(item.endDate)
            };
        }

        // שליפת יום בשבוע, תאריך עברי ופרשת השבוע ממאגר Hebcal האמין
        async function updateHebrewDateAndParasha() {
            const now = new Date();
            const weekday = now.toLocaleDateString('he-IL', { weekday: 'long' });
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            const nextWeek = new Date(now.getTime() + 7 * 86400000);
            const endY = nextWeek.getFullYear();
            const endM = String(nextWeek.getMonth() + 1).padStart(2, '0');
            const endD = String(nextWeek.getDate()).padStart(2, '0');
            const nextWeekStr = `${endY}-${endM}-${endD}`;

            try {
                const convRes = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${yyyy}&gm=${mm}&gd=${dd}&g2h=1`);
                const convData = await convRes.json();
                const hebrewDate = convData.hebrew || '';

                const calRes = await fetch(`https://www.hebcal.com/hebcal?v=1&cfg=json&s=on&i=on&start=${todayStr}&end=${nextWeekStr}`);
                const calData = await calRes.json();
                const parashaItem = (calData.items || []).find(item => item.category === 'parashat');
                const parasha = parashaItem ? parashaItem.hebrew : '';

                const parts = [weekday, hebrewDate, parasha].filter(Boolean);
                document.getElementById('tvDateDisplay').innerText = parts.join(' • ');
            } catch (err) {
                console.error("שגיאה בטעינת לוח שנה עברי:", err);
                const fallbackHebrew = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {
                    day: 'numeric', month: 'long', year: 'numeric'
                }).format(now);
                document.getElementById('tvDateDisplay').innerText = `${weekday} • ${fallbackHebrew}`;
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value.trim();
            if (pin) {
                localStorage.setItem('parnas_user_pin', pin);
                document.getElementById('authScreen').style.display = 'none';
                fetchFromSheet();
                if (window.location.search.includes('mode=tv')) {
                    openTvMode();
                }
            }
        }

        function logout() {
            localStorage.removeItem('parnas_user_pin');
            location.reload();
        }

        function setLoading(isLoading) {
            document.getElementById('syncLoader').classList.toggle('hidden', !isLoading);
        }

        async function fetchFromSheet() {
            const pin = localStorage.getItem('parnas_user_pin');
            if (!pin) return;

            setLoading(true);
            try {
                const res = await fetch(`${SCRIPT_URL}?pin=${encodeURIComponent(pin)}`);
                const data = await res.json();
                
                if (data.status === "error") {
                    alert("קוד ה-PIN שגוי!");
                    logout();
                    return;
                }

                dbData = { 
                    active: (data.active || []).map(normalizeRow), 
                    archive: (data.archive || []).map(normalizeRow) 
                };
                renderActive();
                renderArchive();
                if (document.getElementById('tvScreen').style.display === 'block') {
                    renderTvCards();
                    updateHebrewDateAndParasha();
                }
            } catch (err) {
                console.error("שגיאה במשיכת נתונים:", err);
            } finally {
                setLoading(false);
            }
        }

        async function sendToSheet(payload) {
            payload.pin = localStorage.getItem('parnas_user_pin');
            setLoading(true);
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (result.status === "error") {
                    alert("שגיאה: קוד ה-PIN שגוי!");
                    logout();
                    setLoading(false);
                    return false;
                }
                await fetchFromSheet();
                return true;
            } catch (err) {
                alert("שגיאה בשמירת הנתונים מול גוגל");
                setLoading(false);
                return false;
            }
        }

        // לשונית ברכות השבוע בעיצוב הלבן והנקי המקורי
        function renderActive() {
            const search = document.getElementById('activeSearch').value.toLowerCase();
            const dateFilter = document.getElementById('dateFilter').value;

            let list = dbData.active.filter(item => {
                const matchSearch = (item.donorName || '').toLowerCase().includes(search) || 
                                    (item.blessingText || '').toLowerCase().includes(search);
                const matchDate = !dateFilter || (dateFilter >= item.startDate && dateFilter <= item.endDate);
                return matchSearch && matchDate;
            });

            document.getElementById('activeList').innerHTML = list.map(item => `
                <div class="ios-card flex justify-between items-start">
                    <div class="flex-1 pl-3" onclick="startEditBlessing('${item.id}')">
                        <div class="font-bold text-lg text-gray-900">${item.donorName}</div>
                        <div class="text-sm text-gray-600 mt-1">${item.blessingText}</div>
                        ${(item.startDate || item.endDate) ? `
                        <div class="text-[11px] text-gray-400 mt-2 flex items-center gap-1">
                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${item.startDate} עד ${item.endDate}
                        </div>` : ''}
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="startEditBlessing('${item.id}')" class="text-gray-400 p-1.5 active:scale-90">
                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteItem('active', '${item.id}')" class="text-red-400 p-1.5 active:scale-90">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-400 mt-10">אין ברכות פעילות התואמות לסינון</p>';
            lucide.createIcons();
        }

        // לשונית ארכיון בעיצוב הלבן והנקי המקורי
        function renderArchive() {
            const search = document.getElementById('archiveSearch').value.toLowerCase();
            let list = dbData.archive.filter(item => 
                (item.donorName || '').toLowerCase().includes(search) || 
                (item.blessingText || '').toLowerCase().includes(search)
            );

            document.getElementById('archiveList').innerHTML = list.map(item => `
                <div class="ios-card flex justify-between items-center">
                    <div class="flex-1 pl-3">
                        <div class="font-bold text-gray-900 text-base">${item.donorName}</div>
                        <div class="text-gray-600 text-sm mt-0.5">${item.blessingText}</div>
                        ${(item.startDate || item.endDate) ? `
                        <div class="text-[11px] text-gray-400 mt-1.5 flex items-center gap-1">
                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${item.startDate} עד ${item.endDate}
                        </div>` : ''}
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="reuseFromArchive('${item.id}')" class="bg-blue-50 text-blue-600 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 active:bg-blue-100">
                            <i data-lucide="copy-plus" class="w-4 h-4"></i> שכפל
                        </button>
                        <button onclick="deleteItem('archive', '${item.id}')" class="text-red-300 p-2 active:text-red-500">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-400 mt-10">הארכיון ריק</p>';
            lucide.createIcons();
        }

        function setDefaultDates() {
            const today = new Date().toISOString().slice(0, 10);
            const nextWeek = new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10);
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = nextWeek;
        }

        function openNewBlessingModal() {
            document.getElementById('blessingForm').reset();
            document.getElementById('editId').value = "";
            document.getElementById('fromArchiveFlag').value = "";
            document.getElementById('modalTitle').innerText = "הוספת ברכה חדשה";
            setDefaultDates();
            openModal('blessing');
        }

        function startEditBlessing(id) {
            const item = dbData.active.find(a => a.id.toString() === id.toString());
            if (!item) return;
            document.getElementById('editId').value = item.id;
            document.getElementById('fromArchiveFlag').value = "true";
            document.getElementById('donorName').value = item.donorName;
            document.getElementById('blessingText').value = item.blessingText;
            document.getElementById('startDate').value = item.startDate;
            document.getElementById('endDate').value = item.endDate;
            document.getElementById('modalTitle').innerText = "עריכת ברכה קיימת";
            openModal('blessing');
        }

        function reuseFromArchive(archiveId) {
            const item = dbData.archive.find(a => a.id.toString() === archiveId.toString());
            if (!item) return;
            document.getElementById('editId').value = "";
            document.getElementById('fromArchiveFlag').value = "true";
            document.getElementById('donorName').value = item.donorName;
            document.getElementById('blessingText').value = item.blessingText;
            setDefaultDates();
            document.getElementById('modalTitle').innerText = "שכפול מהארכיון (בחר תאריך חדש)";
            openModal('blessing');
        }

        document.getElementById('blessingForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "שמור ב-Google Sheets...";

            const editId = document.getElementById('editId').value;
            const payload = {
                action: editId ? "edit" : "add",
                id: editId,
                donorName: document.getElementById('donorName').value,
                blessingText: document.getElementById('blessingText').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                fromArchive: document.getElementById('fromArchiveFlag').value === "true"
            };

            const ok = await sendToSheet(payload);
            btn.disabled = false;
            btn.innerText = "שמור בלוח";

            if (ok) {
                closeAllModals();
                switchTab('activeTab');
            }
        };

        async function deleteItem(target, id) {
            const msg = target === 'archive' ? 'למחוק לצמיתות מהארכיון?' : 'להסיר מהלוח הפעיל? (הברכה תישאר בארכיון)';
            if (confirm(msg)) {
                await sendToSheet({ action: 'delete', target: target, id: id });
            }
        }

        // קוביות הטלוויזיה בעיצוב בית כנסת מפואר ובכתב תורה / סת"ם
        function renderTvCards() {
            const today = new Date().toISOString().slice(0, 10);
            let validItems = dbData.active.filter(item => today >= item.startDate && today <= item.endDate);
            if (validItems.length === 0) validItems = dbData.active;

            document.getElementById('tvTrack').innerHTML = validItems.map(item => `
                <div class="tv-card">
                    <div class="tv-card-body">
                        <div class="tv-card-pillar"></div>
                        <div class="tv-card-content torah-font">
                            <!-- שם המשפחה בצבע צהוב בכתב תורה -->
                            <div class="text-5xl font-bold text-yellow-400 mb-4">${item.donorName}</div>
                            <!-- נוסח הברכה בצבע לבן בכתב תורה מתחת -->
                            <div class="text-3xl text-white leading-relaxed">${item.blessingText}</div>
                        </div>
                        <div class="tv-card-pillar"></div>
                    </div>
                </div>
            `).join('') || '<div class="text-center text-4xl text-slate-400 mt-20 torah-font">אין ברכות פעילות להצגה כעת</div>';
        }

        function openTvMode() {
            document.getElementById('tvScreen').style.display = 'block';
            updateHebrewDateAndParasha();
            renderTvCards();
            lucide.createIcons();
            if (!tvInterval) {
                tvInterval = setInterval(fetchFromSheet, 180000);
            }
        }

        function closeTvMode() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            document.getElementById('tvScreen').style.display = 'none';
            if (tvInterval) {
                clearInterval(tvInterval);
                tvInterval = null;
            }
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-blue-600', 'text-gray-400'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.replace('text-gray-400', 'text-blue-600');
            document.getElementById('page-title').innerText = id === 'activeTab' ? 'ברכות השבוע' : 'ארכיון ברכות';
            lucide.createIcons();
        }

        function openModal(name) { document.getElementById(name + 'Modal').style.display = 'block'; lucide.createIcons(); }
        function closeAllModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        function closeModalOnBackdrop(e) { if (e.target.classList.contains('modal')) closeAllModals(); }

        window.onload = init;
    </script>
</body>
</html>
